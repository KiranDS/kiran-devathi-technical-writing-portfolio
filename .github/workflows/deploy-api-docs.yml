name: Deploy LedgerLite API documentation

on:
  push:
    branches: [main]
    paths:
      - "projects/01-rest-api-documentation/openapi/ledgerlite-v1.yaml"
      - "site/**"
      - ".github/workflows/deploy-api-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare published site
        run: |
          mkdir -p site/openapi
          cp projects/01-rest-api-documentation/openapi/ledgerlite-v1.yaml site/openapi/ledgerlite-v1.yaml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
