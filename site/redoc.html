<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LedgerLite fictional REST API reference">
  <title>LedgerLite API Reference</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    .top {
      position: sticky; top: 0; z-index: 10;
      padding: 12px 22px; background: #111827;
    }
    .top a { color: #fff; }
    #redoc-container { min-height: 70vh; }
    #load-error {
      display: none; margin: 24px; padding: 18px;
      border: 1px solid #d97706; border-radius: 8px;
      background: #fff8e8; color: #33220a;
    }
  </style>
</head>
<body>
  <nav class="top"><a href="./">← LedgerLite documentation home</a></nav>
  <main>
    <div id="load-error" role="alert">
      <strong>The API reference could not be rendered.</strong>
      <p>Check that the OpenAPI file is available at <code>./openapi/ledgerlite-v1.yaml</code>
      and that the Redoc script can load from the CDN. You can still inspect the
      <a href="./openapi/ledgerlite-v1.yaml">OpenAPI YAML</a> or use
      <a href="./swagger.html">Swagger UI</a>.</p>
    </div>
    <div id="redoc-container"></div>
  </main>

  <script>
    (function () {
      const showError = () => {
        document.getElementById("load-error").style.display = "block";
      };

      const script = document.createElement("script");
      script.src = "https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js";
      script.onload = function () {
        if (!window.Redoc || typeof window.Redoc.init !== "function") {
          showError();
          return;
        }

        window.Redoc.init(
          "./openapi/ledgerlite-v1.yaml",
          {
            scrollYOffset: 48,
            hideDownloadButton: false,
            expandResponses: "200,201",
            requiredPropsFirst: true,
            theme: {
              colors: {
                primary: { main: "#2457c5" }
              },
              typography: {
                fontFamily: "system-ui, -apple-system, Segoe UI, sans-serif",
                headings: {
                  fontFamily: "system-ui, -apple-system, Segoe UI, sans-serif"
                }
              }
            }
          },
          document.getElementById("redoc-container"),
          showError
        );
      };
      script.onerror = showError;
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
