<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LedgerLite Interactive API Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>body{margin:0}.top{padding:12px 22px;background:#111827}.top a{color:#fff}#swagger-ui{max-width:1200px;margin:18px auto}</style>
</head>
<body>
  <div class="top"><a href="./">← LedgerLite documentation home</a></div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: "./openapi/ledgerlite-v1.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        docExpansion: "list",
        presets: [SwaggerUIBundle.presets.apis]
      });
    };
  </script>
</body>
</html>
